# LLM settings for the agent layer (Stage 5+). Override the model with DIP_LLM_MODEL.
# Verified with the Models API on 2026-10-18: claude-haiku-5-5 is active, 1M context,
# 128K max output; supports adaptive thinking and effort (budget_tokens is not supported).

[primary]
provider = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
thinking = "adaptive"
effort = "medium"

# Tried in order on rate limits, outages, or a missing key, per worker step (Stage 10,
# S10.1: dip.agents.llm.Failover). Evals run against each.
[[fallback]]
provider = "gemini"
# Checked 2026-10-23: gemini-2.5-flash is closed to new users; this one answers (free tier).
model = "gemini-3.1-flash-lite"
api_key_env = "GEMINI_API_KEY"

# Gemini is the only fallback (decisions log, 2026-10-23): no Groq or OpenRouter client.
