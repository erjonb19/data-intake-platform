# Policy for the contract author, the intake team's map worker (Stage 5; Stage 10, S10.4;
# PLAN.md sections 4.2, 8.8 and 8.12). Enforced by the tool registry behind the MCP server,
# never by the model; every call is audited.
agent: contract_author
description: >
  Writes a candidate contract from the job's profile (built by the platform; no vendor
  text), validates it and submits it. It cannot see the file itself, propose to a person,
  or act: the validator checks the candidate again and the orchestrator proposes it.
max_tier: propose
# The agent writes rules, not records: it never needs a PHI value.
mask_phi: true
tools:
  - get_intake_profile
  - get_contract
  - get_contract_text
  - validate_contract
  - submit_candidate
limits:
  max_calls_per_run: 40
  max_calls_per_hour: 400
  submit_candidate:
    max_per_run: 2
    max_per_hour: 40
