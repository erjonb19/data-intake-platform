# Vendor invoices as PDFs, one invoice per file, native or scanned (finance pack, Stage 3,
# S3.1). Generated by packs/finance/generators/invoice_pdfs.py. Read by dip/pdffeed.py:
# the text layer, or OCR for scans, then fields found by their labels. Matched to the
# Excel register in gold.invoice_match.
feed: finance.vendor_invoice_pdf
version: 1
owner: ap-ops@example.com
description: >
  One invoice per PDF as vendors send them: some typed (a text layer), some scanned. All
  data is generated and invented.
classification: internal
source:
  channels: [minio, sftp, api]
  filename_pattern: "invoice_*.pdf"
  filename_date:
    regex: "^invoice_INV-[0-9]+_([0-9]+)"
    format: "%Y%m%d"
    max_days_before_received: 7
    max_days_after_received: 0
format:
  type: pdf
  # A scan whose mean word confidence is under this is quarantined (OCR.LOW_CONFIDENCE).
  min_ocr_confidence: 75
  ocr_dpi: 300
  fields:
    vendor_name: {first_line: true}
    vendor_id: Vendor ID
    invoice_number: Invoice number
    invoice_date: Invoice date
    due_date: Due date
    po_number: PO number
    payment_terms: Payment terms
    currency: Currency
    subtotal: Subtotal
    tax: Tax
    total: Total
on_row_violation: reject_file
min_rows: 1
columns:
  - { name: invoice_number, type: string, required: true, pattern: "^INV-[0-9]{6}$" }
  - { name: vendor_id, type: string, required: true, pattern: "^V[0-9]{4}$" }
  - { name: vendor_name, type: string, required: true }
  - { name: invoice_date, type: date, required: true, min: "2020-01-01", max: today }
  - { name: due_date, type: date, required: true, min: "2020-01-01" }
  - { name: po_number, type: string, required: true, pattern: "^PO-[0-9]{6}$" }
  - { name: payment_terms, type: string, required: true, allowed: [NET15, NET30, NET45, NET60] }
  - { name: currency, type: string, required: true, allowed: [USD] }
  - { name: subtotal, type: decimal, required: true, min: 0, max: 10000000 }
  - { name: tax, type: decimal, required: true, min: 0, max: 10000000 }
  - { name: total, type: decimal, required: true, min: 0, max: 10000000 }
  - { name: extraction, type: string, required: true, allowed: [native, ocr] }
  - { name: ocr_confidence, type: decimal, min: 0, max: 100 }
