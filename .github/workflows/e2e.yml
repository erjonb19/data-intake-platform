name: e2e

# Creates a kind cluster with Terraform, deploys the stack, and runs the end-to-end
# tests. Extended stage by stage (PLAN.md section 6).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0
  # Stage 3: CI deploys the observability profile too (the laptop runs it only on demand).
  TF_VAR_profiles: '["core", "observability"]'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # Stage 11: the platform drills add up to 15 minutes
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" \
            | awk '{print $1"  kind"}' | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Prerequisites
        run: bash scripts/prereqs.sh || true

      # CLAUDE.md's memory budget (from Stage 13 on): the run's peak memory goes in the PROGRESS
      # line of a stage that adds a service. Sampled every 5 s from /proc/meminfo
      # (MemTotal - MemAvailable), the highest kept; reported in the last step.
      - name: Start the memory sampler
        run: |
          nohup bash -c 'peak=0; while :; do
            used=$(awk "/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} END{print t-a}" /proc/meminfo)
            [ "$used" -gt "$peak" ] && peak=$used && echo "$peak" > "$RUNNER_TEMP/mem-peak-kib"
            sleep 5; done' >/dev/null 2>&1 &

      - name: Bring up stack
        run: bash scripts/up.sh

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: E2E (FHIR intake and file-feed cases)
        run: |
          # A venv, because the runner's system Python is externally managed (PEP 668).
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --no-deps -r requirements/build.txt && .venv/bin/pip install -q --require-hashes --no-deps --no-build-isolation -r requirements/e2e.txt
          bash scripts/e2e.sh

      # Always, per PLAN.md section 6: pod logs, cluster state and a dump of the ops schema.
      - name: Collect diagnostics
        if: always()
        run: bash scripts/diagnostics.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: artifacts/
          retention-days: 7

      - name: Tear down
        if: always()
        run: bash scripts/down.sh

      - name: Peak memory
        if: always()
        run: |
          peak=$(cat "$RUNNER_TEMP/mem-peak-kib" 2>/dev/null || echo 0)
          total=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          line=$(awk -v p="$peak" -v t="$total" 'BEGIN{printf "peak memory used on the runner: %.1f GiB of %.1f GiB", p/1048576, t/1048576}')
          echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$peak" -gt $((12 * 1048576)) ]; then
            echo "::warning::over the 12 GiB memory budget (CLAUDE.md): stop and ask before adding services"
          fi
