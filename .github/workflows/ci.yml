name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install "ruff==0.17.*"
          ruff check .
          ruff format --check .

      - name: No MIMIC data committed
        run: bash scripts/check_no_mimic_data.sh

      - name: Shell scripts
        run: |
          bash -n scripts/*.sh packs/*/generators/*.sh packs/mimic/fetch.sh
          shellcheck -x scripts/*.sh packs/*/generators/*.sh packs/mimic/fetch.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dip
          POSTGRES_PASSWORD: dip
          POSTGRES_DB: dip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dip" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIP_TEST_DSN: postgresql://dip:dip@localhost:5432/dip_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache Synthea jar and vocabulary
        uses: actions/cache@v5
        with:
          path: data/cache
          key: research-cache-${{ hashFiles('packs/healthcare/generators/synthea.sha256', 'dip/vocab.py') }}

      - name: Generate synthetic patients (Synthea, fixed seed)
        run: bash packs/healthcare/generators/synthea.sh 25 data/synthea

      - name: Unit, Postgres integration and dbt (OMOP) tests
        env:
          DIP_SYNTHEA_DIR: data/synthea
        run: pytest -q -s -rs
