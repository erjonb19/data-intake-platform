name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install --require-hashes --no-deps -r requirements/build.txt && pip install --require-hashes --no-deps --no-build-isolation -r requirements/tools.txt
          ruff check .
          ruff format --check .

      # 24.4: every hashed lock in requirements/ matches a fresh compile at its cutoff.
      - name: Python locks are current
        run: python scripts/lock.py --check

      - name: No MIMIC data committed
        run: bash scripts/check_no_mimic_data.sh

      - name: Shell scripts
        run: |
          bash -n scripts/*.sh packs/*/generators/*.sh packs/mimic/fetch.sh
          shellcheck -x scripts/*.sh packs/*/generators/*.sh packs/mimic/fetch.sh

      # Stage 3 (S3.2): the alert rules load and behave as their unit tests say, and the
      # dashboards are what their generator writes.
      - name: Prometheus rules and Grafana dashboards
        run: |
          promtool() {
            docker run --rm -v "$PWD/observability/prometheus:/r:ro" -w /r \
              --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 "$@"
          }
          promtool check rules rules.yml
          promtool test rules rules_test.yml
          python observability/grafana/make_dashboards.py
          git diff --exit-code observability/grafana

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      # 13.5: the same code under OpenTofu, the open-source fork. Its own data directory, so
      # it downloads providers from its own registry and shares nothing with the step above.
      # The action checks the binary against the release's SHA256SUMS.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false

      - name: OpenTofu init and validate
        working-directory: infra/terraform
        env:
          TF_DATA_DIR: .tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dip
          POSTGRES_PASSWORD: dip
          POSTGRES_DB: dip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dip" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIP_TEST_DSN: postgresql://dip:dip@localhost:5432/dip_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --require-hashes --no-deps -r requirements/build.txt && pip install --require-hashes --no-deps --no-build-isolation -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .
          pip check

      # Stage 3: the PDF invoice tests OCR scans with it (they skip without it, as on a laptop).
      - name: Tesseract (the OCR image's engine)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Cache Synthea jar and vocabulary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache
          key: research-cache-${{ hashFiles('packs/healthcare/generators/synthea.sha256', 'dip/vocab.py') }}

      - name: Generate synthetic patients (Synthea, fixed seed)
        run: bash packs/healthcare/generators/synthea.sh 25 data/synthea

      - name: Unit, Postgres integration and dbt (OMOP) tests
        env:
          DIP_SYNTHEA_DIR: data/synthea
        run: pytest -q -s -rs
