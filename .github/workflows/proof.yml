name: proof

# Stage 10 (S10.6): the stage's one proof with a model key, on a GitHub runner instead of
# the laptop (16 GB was not enough for the kind node next to everything else). Manual only:
# no push, pull_request or schedule trigger, so the key is never used unless a person with
# write access starts it. The stack comes up with the core profile and no model key, the
# E2E runs as in e2e.yml (spending nothing), then scripts/proof_intake.py runs the intake
# team once, in the cluster, on the E2E's onboarding sample, with DIP_SPEND_CAP_USD set.
# The screenshots and results.md are uploaded; the cluster is torn down.
#
# Stage 11: commit-results commits what a run made (recordings, a proof's results) to the
# s11-* branch the run was started from, once every check passed (the scrub, the key and
# auth-header check, and for recordings their replay). It has contents: write and nothing
# else, no model key, never pushes to main and never forces: a branch that moved since the
# run started is refused. A push made with the workflow's token starts no other workflow,
# so CI runs on the branch's next push by a person (the PR still needs a fresh review and
# green CI before merge).

on:
  workflow_dispatch:
    inputs:
      spend_cap_usd:
        description: "Stop before a request could take the run's model spend past this"
        default: "0.25"
      job:
        # Stage 11 (S11.7): record the incident cases (and the demo) here, not on the laptop.
        description: "proof (the S10.6 proof), gemini-recordings or claude-recordings"
        type: choice
        options: [proof, gemini-recordings, claude-recordings]
        default: proof

permissions:
  contents: read

concurrency:
  group: proof
  cancel-in-progress: false

env:
  KIND_VERSION: v0.33.0
  TF_VAR_profiles: '["core"]'

jobs:
  proof:
    if: inputs.job == 'proof'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `dip approvals execute` cuts the contract branch from main

      - name: A local main for the contract branch
        run: git branch -f main origin/main 2>/dev/null || true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" \
            | awk '{print $1"  kind"}' | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Prerequisites
        run: bash scripts/prereqs.sh || true

      - name: Bring up stack (no model key)
        run: bash scripts/up.sh

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: E2E
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"  # boto3, PyYAML, openpyxl, websocket-client, dbt
          bash scripts/e2e.sh

      - name: The intake team, once, with the key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIP_SPEND_CAP_USD: ${{ inputs.spend_cap_usd }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "the ANTHROPIC_API_KEY secret is not set"; exit 1; }
          tf() { terraform -chdir=infra/terraform "$@"; }
          export KUBECONFIG="$(tf output -raw kubeconfig_path)"
          export WAREHOUSE_DSN="$(tf output -raw warehouse_dsn)"
          export APPROVALS_TOKEN="$(tf output -raw approvals_token)"
          export AIRFLOW_IMAGE="dip-airflow:$(jq -r .airflow_image_tag infra/terraform/image.auto.tfvars.json)"
          # `dip approvals execute` commits the contract branch: a runner has no git identity.
          export GIT_AUTHOR_NAME="S10.6 proof" GIT_AUTHOR_EMAIL="proof@localhost"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export CHROME="$(command -v google-chrome)" DBT="$PWD/.venv/bin/dbt"
          kubectl -n dip-data port-forward svc/approvals 8081 >/dev/null 2>&1 &
          trap 'kill %1' EXIT
          for _ in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null && break; sleep 1; done
          .venv/bin/python scripts/proof_intake.py artifacts/proof

      # Stage 11: the results, checked, for commit-results (only when every step passed).
      - name: The results to commit, checked for the key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUT: docs/demos/proof/run-${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p "$OUT" artifacts/commit
          cp artifacts/proof/results.md artifacts/proof/audit.json "$OUT"/
          cp artifacts/proof/*.png "$OUT"/ 2>/dev/null || true
          { echo "job: proof (run ${{ github.run_id }})"
            python -I scripts/check_recordings.py --key-env ANTHROPIC_API_KEY "$OUT"
            echo "replay check: n/a (a proof's results, not recordings)"
          } | tee artifacts/commit/checks.md
          ! grep -q FAILED artifacts/commit/checks.md

      - name: Upload the results to commit
        uses: actions/upload-artifact@v7
        with:
          name: proof-commit
          path: |
            docs/demos/proof/run-${{ github.run_id }}/*
            artifacts/commit/checks.md
          retention-days: 7

      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s10-6-proof
          path: |
            artifacts/proof/*.png
            artifacts/proof/results.md
            artifacts/proof/audit.json
          retention-days: 30

      - name: Collect diagnostics
        if: failure()
        run: bash scripts/diagnostics.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proof-diagnostics
          path: artifacts/
          retention-days: 7

      - name: Tear down
        if: always()
        run: bash scripts/down.sh

  # Stage 11 (S11.7): the incident eval cases recorded on Gemini (the free fallback), one
  # at a time, against a Postgres service. No kind cluster and no Anthropic key: only the
  # GEMINI_API_KEY secret. The recordings are scrubbed of the key and checked, then
  # uploaded as an artifact for a person to pull and commit.
  gemini-recordings:
    if: inputs.job == 'gemini-recordings'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dip
          POSTGRES_PASSWORD: dip
          POSTGRES_DB: dip_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dip" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -e ".[dev]"

      - name: Record the incident cases on Gemini, one at a time
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIP_EVAL_DSN: postgresql://dip:dip@localhost:5432/dip_eval
          PYTHONUTF8: "1"
        run: |
          test -n "$GEMINI_API_KEY" || { echo "the GEMINI_API_KEY secret is not set"; exit 1; }
          bash scripts/record_gemini_incidents.sh
          mkdir -p artifacts/commit
          set -o pipefail
          { echo "job: gemini-recordings (run ${{ github.run_id }})"
            grep -hE "^(PASS|FAIL) " artifacts/gemini/*.log || true
            echo "scrub: ok"
            python -I scripts/check_recordings.py --key-env GEMINI_API_KEY \
              agents/evals/incident/recordings/gemini
          } | tee artifacts/commit/checks.md
          ! grep -q FAILED artifacts/commit/checks.md

      # The new recordings replay, without a key, as CI's test job replays them.
      - name: Replay the new recordings
        env:
          DIP_EVAL_DSN: postgresql://dip:dip@localhost:5432/dip_replay
          DIP_TEST_DSN: postgresql://dip:dip@localhost:5432/dip_test
          PYTHONUTF8: "1"
        run: |
          for db in dip_replay dip_test; do
            PGPASSWORD=dip psql -h localhost -U dip -d dip_eval -c "create database $db"
          done
          if python -m dip incident eval --provider gemini --out artifacts/replay \
               && pytest -q -p no:cacheprovider tests/integration/test_fallback_chain.py; then
            echo "replay check: ok (dip incident eval --provider gemini, test_fallback_chain.py)" \
              | tee -a artifacts/commit/checks.md
          else
            echo "replay check: FAILED" | tee -a artifacts/commit/checks.md; exit 1
          fi

      # Only when every step succeeded: a recording that holds the key, an auth header, or
      # does not replay is never uploaded, so never committed.
      - name: Upload the recordings
        uses: actions/upload-artifact@v7
        with:
          name: gemini-incident-recordings
          path: |
            agents/evals/incident/recordings/gemini/*.json
            artifacts/commit/checks.md
          retention-days: 7

  # Claude's recordings: the 8 incident cases and the demo, in one process under one cap
  # (spend_cap_usd, which must be 0.10 or less here). Same rules as gemini-recordings.
  claude-recordings:
    if: inputs.job == 'claude-recordings'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dip
          POSTGRES_PASSWORD: dip
          POSTGRES_DB: dip_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dip" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -e ".[dev]"

      - name: A second database, for the demo
        run: PGPASSWORD=dip psql -h localhost -U dip -d dip_eval -c "create database dip_demo_eval"

      - name: Record the incident cases and the demo on Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIP_SPEND_CAP_USD: ${{ inputs.spend_cap_usd }}
          DIP_EVAL_DSN: postgresql://dip:dip@localhost:5432/dip_eval
          DIP_DEMO_DSN: postgresql://dip:dip@localhost:5432/dip_demo_eval
          PYTHONUTF8: "1"
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "the ANTHROPIC_API_KEY secret is not set"; exit 1; }
          python -c "import os,sys; sys.exit(float(os.environ['DIP_SPEND_CAP_USD']) > 0.10)"             || { echo "claude-recordings takes spend_cap_usd 0.10 or less"; exit 1; }
          set -o pipefail  # the recording's own exit status, not tee's
          bash scripts/record_claude_incidents.sh 2>&1 | tee artifacts-claude.log
          mkdir -p artifacts/commit
          { echo "job: claude-recordings (run ${{ github.run_id }})"
            grep -E "^(PASS|FAIL) |spent " artifacts-claude.log || true
            echo "scrub: ok"
            python -I scripts/check_recordings.py --key-env ANTHROPIC_API_KEY \
              agents/evals/incident/recordings/*.json agents/evals/demo/recordings
          } | tee artifacts/commit/checks.md
          ! grep -q FAILED artifacts/commit/checks.md

      # The new recordings replay, without a key, as CI's test job replays them.
      - name: Replay the new recordings
        env:
          DIP_TEST_DSN: postgresql://dip:dip@localhost:5432/dip_test
          PYTHONUTF8: "1"
        run: |
          PGPASSWORD=dip psql -h localhost -U dip -d dip_eval -c "create database dip_test"
          if pytest -q -p no:cacheprovider tests/integration/test_incident_chain.py \
               tests/integration/test_demo.py; then
            echo "replay check: ok (test_incident_chain.py, test_demo.py)" \
              | tee -a artifacts/commit/checks.md
          else
            echo "replay check: FAILED" | tee -a artifacts/commit/checks.md; exit 1
          fi

      # Only when every step succeeded: a recording that holds the key, an auth header, or
      # does not replay is never uploaded, so never committed.
      - name: Upload the recordings
        uses: actions/upload-artifact@v7
        with:
          name: claude-incident-recordings
          path: |
            agents/evals/incident/recordings/*.json
            agents/evals/demo/recordings/*.json
            artifacts/commit/checks.md
          retention-days: 7

  # Stage 11: commit what the run made to the s11-* branch it was started from. See the
  # header. Runs only when the one job that ran succeeded (every check in it passed).
  commit-results:
    needs: [proof, gemini-recordings, claude-recordings]
    if: >-
      always() && github.ref_type == 'branch' && startsWith(github.ref_name, 's11-') &&
      contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The branch, and the job whose results these are
        id: which
        env:
          BRANCH: ${{ github.ref_name }}
          PROOF: ${{ needs.proof.result }}
          GEMINI: ${{ needs.gemini-recordings.result }}
          CLAUDE: ${{ needs.claude-recordings.result }}
        run: |
          [[ "$BRANCH" =~ ^s11-[A-Za-z0-9._-]+$ ]] || { echo "not an s11-* branch: $BRANCH"; exit 1; }
          if [ "$PROOF" = success ]; then name=proof-commit
          elif [ "$GEMINI" = success ]; then name=gemini-incident-recordings
          elif [ "$CLAUDE" = success ]; then name=claude-incident-recordings
          else echo "nothing succeeded"; exit 1; fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"

      # The commit the run was started from: the push below is refused if the branch has
      # moved since (the files were made for this commit).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.which.outputs.artifact }}
          path: ${{ runner.temp }}/incoming

      # Only the expected paths come in; checked again here (no key in this job: key shapes
      # and auth headers), and the recording job's own checks must all say ok.
      - name: Check and copy in
        env:
          IN: ${{ runner.temp }}/incoming
        run: |
          allowed='^(agents/evals/(incident|demo)/recordings/(gemini/)?[A-Za-z0-9_.-]+\.json|docs/demos/proof/run-[0-9]+/[A-Za-z0-9_.-]+\.(md|json|png)|artifacts/commit/checks\.md)$'
          (cd "$IN" && find . -type f | sed 's|^\./||') > "$RUNNER_TEMP/files"
          if grep -vE "$allowed" "$RUNNER_TEMP/files"; then echo "unexpected files (above)"; exit 1; fi
          grep -qx "artifacts/commit/checks.md" "$RUNNER_TEMP/files" || { echo "no checks.md"; exit 1; }
          cp "$IN/artifacts/commit/checks.md" "$RUNNER_TEMP/checks.md"
          for c in "key check" "auth-header check" "replay check"; do
            grep -E "^$c[ (].*: ok|^$c: (ok|n/a)" "$RUNNER_TEMP/checks.md" \
              || { echo "$c did not pass"; exit 1; }
          done
          if grep -q FAILED "$RUNNER_TEMP/checks.md"; then echo "a check failed"; exit 1; fi
          python -I scripts/check_recordings.py "$IN" | tee -a "$RUNNER_TEMP/checks.md"
          grep -v '^artifacts/' "$RUNNER_TEMP/files" | while read -r f; do
            mkdir -p "$(dirname "$f")"; cp "$IN/$f" "$f"
          done

      - name: Commit and push to the branch (never main, never forced)
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add agents/evals docs/demos/proof
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "Stage 11: ${{ steps.which.outputs.artifact }} from proof run ${{ github.run_id }}"
            echo
            echo "Made on ${{ github.sha }} by $RUN_URL"
            echo
            echo "Files:"
            git diff --cached --name-status | sed 's/^/  /'
            echo
            echo "Checks:"
            sed 's/^/  /' "$RUNNER_TEMP/checks.md"
          } > "$RUNNER_TEMP/message"
          git commit -q -F "$RUNNER_TEMP/message"
          git log -1 --stat
          [ "$BRANCH" != main ] || exit 1
          git push origin "HEAD:refs/heads/$BRANCH"
