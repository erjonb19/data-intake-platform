name: codeql

# 12.9: static analysis of the Python code and of the workflows themselves (free for a public
# repository). Findings appear under Security > Code scanning; the job fails only if the
# analysis cannot run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"   # weekly, Monday 05:41 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
