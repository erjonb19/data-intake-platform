# 12.9: dependency updates, one grouped PR per ecosystem per week, so the e2e runs stay few.
# Every Dependabot PR goes through the same CI (lint, test, e2e, the image scan) and is merged
# by a person.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/images/airflow"
      - "/images/intake-api"
      - "/images/mcp"
    # images/ocr is FROM the Airflow image built here (ARG BASE), so it has no upstream pin.
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
