# Alert rules (Stage 3, S3.2), loaded by Prometheus as alerting_rules.yml. Alerts are shown
# in Prometheus (/alerts) and Grafana; there is no Alertmanager (PLAN.md section 5: memory),
# so nothing is sent anywhere. Thresholds suit the demo feeds, not a production SLA.
# Metric names: dip/metrics.py (dip_*) and the Airflow chart's statsd-exporter (airflow_*).
groups:
  - name: dip-feeds
    rules:
      - alert: FeedLate
        expr: sum by (feed) (dip_incidents_open{kind="FEED.LATE"}) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.feed }} is late"
          description: >-
            An expected file for {{ $labels.feed }} has not arrived within its contract's
            grace window (ops.incident, opened by the feed_sla DAG).
      - alert: QuarantineRateHigh
        expr: >-
          sum by (feed) (dip_files_24h{status="quarantined"})
            / sum by (feed) (dip_files_24h) > 0.2
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.feed }}: {{ $value | humanizePercentage }} of files quarantined"
          description: More than 20% of the feed's files in the last 24 hours were quarantined whole.
      - alert: RowRejectionRateHigh
        expr: >-
          sum by (feed) (dip_rows_24h{outcome="rejected"})
            / sum by (feed) (dip_rows_24h) > 0.1
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.feed }}: {{ $value | humanizePercentage }} of rows rejected"
          description: More than 10% of the feed's rows in the last 24 hours were rejected.
      - alert: DataQualityError
        expr: sum by (test_name) (dip_dq_test_status{status=~"error|fail"}) > 0
        labels: {severity: critical}
        annotations:
          summary: "dbt test {{ $labels.test_name }} failed"
          description: The test's latest result in ops.dq_results is an error, not a warning.
      - alert: MetricsQueryFailing
        expr: dip_metrics_query_ok == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "metrics query {{ $labels.query }} fails"
          description: >-
            The warehouse exporter cannot run this query (a table not created yet, or a
            missing grant to dip_metrics).
  - name: dip-airflow
    rules:
      - alert: DagRunFailing
        # A DAG's first failure creates its series at 1, which increase() cannot see:
        # the second term catches a series that did not exist an hour ago.
        expr: >-
          sum by (dag_id) (increase(airflow_dagrun_failed_count[1h])) > 0
          or sum by (dag_id) (airflow_dagrun_failed_count
                              unless airflow_dagrun_failed_count offset 1h)
        labels: {severity: warning}
        annotations:
          summary: "DAG {{ $labels.dag_id }} failed in the last hour"
          description: A run of {{ $labels.dag_id }} ended failed (Airflow statsd, dagrun.duration.failed).
      # Stage 11 (S11.6): the platform check's view of the scheduler (dip/platform_check.py).
      - alert: AirflowSchedulerDown
        expr: dip_airflow_scheduler_heartbeat_age_seconds > 180
        labels: {severity: critical}
        annotations:
          summary: "The Airflow scheduler has not heartbeat for {{ $value | humanizeDuration }}"
          description: >-
            No DAG runs or tasks are scheduled. Runbook docs/runbooks/09-scheduler-down.md
            (incident PLATFORM.SCHEDULER_DOWN, opened by the platform-check CronJob).
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} is down"
          description: Prometheus cannot scrape {{ $labels.job }}.
  # Stage 11 (S11.4): the agents (dip/metrics.py, dip_agent_* and dip_model_*).
  - name: dip-agents
    rules:
      - alert: AgentFailureRateHigh
        # At least 4 runs, so one failure among few runs is not an alert.
        expr: >-
          sum by (agent) (dip_agent_runs_24h{status="failed"})
            / sum by (agent) (dip_agent_runs_24h) > 0.25
          and sum by (agent) (dip_agent_runs_24h) >= 4
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.agent }}: {{ $value | humanizePercentage }} of runs failed"
          description: >-
            More than 25% of the agent's runs in the last 24 hours failed (a model step:
            a call that errored; a chain: its ops.agent_run or ops.intake_job status).
      - alert: AgentFallbackRateHigh
        expr: >-
          sum by (agent) (dip_agent_fallback_runs_24h)
            / sum by (agent) (dip_agent_runs_24h{status=~"ok|failed"}) > 0.5
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.agent }}: {{ $value | humanizePercentage }} of runs on the fallback"
          description: >-
            More than half the step's runs in the last 24 hours were answered by the free
            fallback provider: Claude is unavailable, or the key is missing or out of credit.
      - alert: ModelSpendDailyHigh
        expr: sum(dip_model_spend_usd_today) > 0.5
        labels: {severity: warning}
        annotations:
          summary: "Model spend today is ${{ $value | printf \"%.2f\" }}"
          description: >-
            Metered spend on live model calls today (UTC) is over $0.50 (ops.model_call,
            dip.agents.llm.cost_usd, which errs high).
