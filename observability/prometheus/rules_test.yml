# promtool unit tests for rules.yml (CI: promtool test rules). Series are what dip-metrics
# and the Airflow statsd-exporter expose.
rule_files: [rules.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'dip_incidents_open{feed="healthcare.claims",kind="FEED.LATE"}'
        values: "1x10"
      - series: 'dip_files_24h{feed="finance.vendor_invoice",status="loaded"}'
        values: "3x10"
      - series: 'dip_files_24h{feed="finance.vendor_invoice",status="quarantined"}'
        values: "1x10"
      - series: 'dip_files_24h{feed="healthcare.eligibility",status="loaded"}'
        values: "9x10"
      - series: 'dip_files_24h{feed="healthcare.eligibility",status="quarantined"}'
        values: "1x10"
      - series: 'dip_dq_test_status{test_name="invoice_totals_add_up",dq_category="plausibility",status="warn"}'
        values: "1x10"
      - series: 'dip_dq_test_status{test_name="not_null_person_id",dq_category="completeness",status="error"}'
        values: "1x10"
      # As the statsd-exporter emits it: no series until the first failure, then 1.
      - series: 'airflow_dagrun_failed_count{dag_id="intake__healthcare__claims"}'
        values: "_ _ 1 1 1 1"
      - series: 'dip_rows_24h{feed="finance.vendor_invoice",outcome="accepted"}'
        values: "8x10"
      - series: 'dip_rows_24h{feed="finance.vendor_invoice",outcome="rejected"}'
        values: "2x10"
      - series: 'dip_metrics_query_ok{query="dip_incidents_open"}'
        values: "0x30"
      - series: 'up{job="dip-metrics"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 1m
        alertname: FeedLate
        exp_alerts:
          - exp_labels: {severity: warning, feed: healthcare.claims}
            exp_annotations:
              summary: "healthcare.claims is late"
              description: >-
                An expected file for healthcare.claims has not arrived within its contract's
                grace window (ops.incident, opened by the feed_sla DAG).
      # 1 of 4 files (25%) is over 20%; 1 of 10 (10%) is not.
      - eval_time: 1m
        alertname: QuarantineRateHigh
        exp_alerts:
          - exp_labels: {severity: warning, feed: finance.vendor_invoice}
            exp_annotations:
              summary: "finance.vendor_invoice: 25% of files quarantined"
              description: More than 20% of the feed's files in the last 24 hours were quarantined whole.
      # A warning is a finding, not an alert; an error is.
      - eval_time: 1m
        alertname: DataQualityError
        exp_alerts:
          - exp_labels: {severity: critical, test_name: not_null_person_id}
            exp_annotations:
              summary: "dbt test not_null_person_id failed"
              description: The test's latest result in ops.dq_results is an error, not a warning.
      - eval_time: 2m
        alertname: DagRunFailing
        exp_alerts:
          - exp_labels: {severity: warning, dag_id: intake__healthcare__claims}
            exp_annotations:
              summary: "DAG intake__healthcare__claims failed in the last hour"
              description: A run of intake__healthcare__claims ended failed (Airflow statsd, dagrun.duration.failed).
      # 2 of 10 rows rejected: 20%, over 10%.
      - eval_time: 1m
        alertname: RowRejectionRateHigh
        exp_alerts:
          - exp_labels: {severity: warning, feed: finance.vendor_invoice}
            exp_annotations:
              summary: "finance.vendor_invoice: 20% of rows rejected"
              description: More than 10% of the feed's rows in the last 24 hours were rejected.
      - eval_time: 12m
        alertname: MetricsQueryFailing
        exp_alerts:
          - exp_labels: {severity: warning, query: dip_incidents_open}
            exp_annotations:
              summary: "metrics query dip_incidents_open fails"
              description: >-
                The warehouse exporter cannot run this query (a table not created yet, or a
                missing grant to dip_metrics).
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: warning, job: dip-metrics}
            exp_annotations:
              summary: "dip-metrics is down"
              description: Prometheus cannot scrape dip-metrics.
  # Stage 11 (S11.4): the agents. triage: 2 of 6 runs failed (fires); map: 1 of 2 failed
  # (under 4 runs: does not); profile: 1 of 10 (does not). map: 2 of 3 runs on the fallback
  # (fires); triage: 1 of 6 (does not). Spend: $0.40 (no), then $0.60 (fires).
  - interval: 30s
    input_series:
      - series: 'dip_agent_runs_24h{agent="triage",status="ok"}'
        values: "4x20"
      - series: 'dip_agent_runs_24h{agent="triage",status="failed"}'
        values: "2x20"
      - series: 'dip_agent_runs_24h{agent="map",status="ok"}'
        values: "3x20"
      - series: 'dip_agent_runs_24h{agent="profile",status="ok"}'
        values: "9x20"
      - series: 'dip_agent_runs_24h{agent="profile",status="failed"}'
        values: "1x20"
      - series: 'dip_agent_fallback_runs_24h{agent="map"}'
        values: "2x20"
      - series: 'dip_agent_fallback_runs_24h{agent="triage"}'
        values: "1x20"
      - series: 'dip_model_spend_usd_today{provider="anthropic"}'
        values: "0.4x4 0.6x16"
      - series: 'dip_model_spend_usd_today{provider="gemini"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 1m
        alertname: AgentFailureRateHigh
        exp_alerts:
          - exp_labels: {severity: warning, agent: triage}
            exp_annotations:
              summary: "triage: 33.33% of runs failed"
              description: >-
                More than 25% of the agent's runs in the last 24 hours failed (a model step:
                a call that errored; a chain: its ops.agent_run or ops.intake_job status).
      - eval_time: 1m
        alertname: AgentFallbackRateHigh
        exp_alerts:
          - exp_labels: {severity: warning, agent: map}
            exp_annotations:
              summary: "map: 66.67% of runs on the fallback"
              description: >-
                More than half the step's runs in the last 24 hours were answered by the free
                fallback provider: Claude is unavailable, or the key is missing or out of credit.
      - eval_time: 1m
        alertname: ModelSpendDailyHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: ModelSpendDailyHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Model spend today is $0.60"
              description: >-
                Metered spend on live model calls today (UTC) is over $0.50 (ops.model_call,
                dip.agents.llm.cost_usd, which errs high).
  # Stage 11 (S11.6): the scheduler's heartbeat age, 60 s (no alert), then 240 s (alert).
  - interval: 30s
    input_series:
      - series: 'dip_airflow_scheduler_heartbeat_age_seconds'
        values: "60x4 240x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: AirflowSchedulerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: AirflowSchedulerDown
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "The Airflow scheduler has not heartbeat for 4m 0s"
              description: >-
                No DAG runs or tasks are scheduled. Runbook docs/runbooks/09-scheduler-down.md
                (incident PLATFORM.SCHEDULER_DOWN, opened by the platform-check CronJob).
  # Stage 11 (S11.7): an open TASK.OOMKILLED incident fires; none, no alert.
  - interval: 30s
    input_series:
      - series: 'dip_incidents_open{feed="_platform",kind="TASK.OOMKILLED"}'
        values: "_ _ 1x10"
    alert_rule_test:
      - eval_time: 30s
        alertname: TaskPodOOMKilled
        exp_alerts: []
      - eval_time: 2m
        alertname: TaskPodOOMKilled
        exp_alerts:
          - exp_labels: {severity: warning, kind: TASK.OOMKILLED}
            exp_annotations:
              summary: "A task's pod ran out of memory (1 task(s))"
              description: >-
                A task's container was OOMKilled (incident TASK.OOMKILLED, opened by the
                platform-check CronJob). Runbook docs/runbooks/10-oomkilled.md.
  # Stage 11 (S11.9): an open TASK.STUCK_QUEUED incident fires; none, no alert.
  - interval: 30s
    input_series:
      - series: 'dip_incidents_open{feed="_platform",kind="TASK.STUCK_QUEUED"}'
        values: "0 0 1x10"
    alert_rule_test:
      - eval_time: 30s
        alertname: TaskQueuedTooLong
        exp_alerts: []
      - eval_time: 2m
        alertname: TaskQueuedTooLong
        exp_alerts:
          - exp_labels: {severity: warning, kind: TASK.STUCK_QUEUED}
            exp_annotations:
              summary: "A task has waited too long to start (1 task(s))"
              description: >-
                A task stayed scheduled or queued past the platform check's threshold (incident
                TASK.STUCK_QUEUED, opened by the platform-check CronJob). Runbook
                docs/runbooks/12-stuck-queued.md.
  # Stage 13 (13.3): an open PLATFORM.ROLLOUT_STALLED incident fires; none, no alert.
  - interval: 30s
    input_series:
      - series: 'dip_incidents_open{feed="_platform",kind="PLATFORM.ROLLOUT_STALLED"}'
        values: "0 0 1x10"
    alert_rule_test:
      - eval_time: 30s
        alertname: ReleaseStalled
        exp_alerts: []
      - eval_time: 2m
        alertname: ReleaseStalled
        exp_alerts:
          - exp_labels: {severity: warning, kind: PLATFORM.ROLLOUT_STALLED}
            exp_annotations:
              summary: "A rollout has stalled (1 deployment(s))"
              description: >-
                A Deployment's new pod did not get Ready within its progress deadline (incident
                PLATFORM.ROLLOUT_STALLED, opened by the platform-check CronJob). The old pod is
                still serving (maxUnavailable 0). Roll it back with `python -m dip rollback
                <service>`, then fix the release in Terraform.
  # Stage 14 (14.1): the last good backup finished at time 0 and none since: 25 h old, no
  # alert; 27 h old, BackupMissing.
  - interval: 1h
    input_series:
      - series: 'dip_backup_last_success_timestamp_seconds'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: {severity: critical, reason: stale}
            exp_annotations:
              summary: "The newest good warehouse backup is 1d 3h 0m 0s old"
              description: >-
                No backup of the warehouse has succeeded in 26 hours (the warehouse-backup
                CronJob runs nightly; ops.backup holds each run's status and error).
                Restore notes: docs/backups.md.
  # A good backup every 12 h: never older than 26 h, no alert.
  - interval: 12h
    input_series:
      - series: 'dip_backup_last_success_timestamp_seconds'
        values: "0+43200x6"
    alert_rule_test:
      - eval_time: 60h
        alertname: BackupMissing
        exp_alerts: []
  # No good backup ever (no series): no alert for 26 h, then BackupMissing.
  - interval: 1h
    input_series:
      - series: 'up{job="dip-metrics"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: {severity: critical, reason: none_yet}
            exp_annotations:
              summary: "No warehouse backup has succeeded yet"
              description: >-
                No backup of the warehouse has succeeded in 26 hours (the warehouse-backup
                CronJob runs nightly; ops.backup holds each run's status and error).
                Restore notes: docs/backups.md.
  # 24.18: refused tool calls. 4 in the hour is the policy working; 6 is a spike.
  - interval: 1m
    input_series:
      - series: 'dip_agent_denied_calls_1h{principal="triage"}'
        values: "4x5 6x5"
      - series: 'dip_agent_denied_calls_1h{principal="human"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: AgentCallsDenied
        exp_alerts: []
      - eval_time: 8m
        alertname: AgentCallsDenied
        exp_alerts:
          - exp_labels: {severity: warning, principal: triage}
            exp_annotations:
              summary: "triage: 6 tool calls refused in the last hour"
              description: "Read ops.audit_log (decision = 'denied') for the reasons; docs/agents/kill-switch.md stops the agents' writes."
  # 24.18: refused intake API uploads. A few are a vendor's typo; 30 in 15 minutes is not.
  - interval: 1m
    input_series:
      - series: 'dip_intake_api_refused_total{reason="unauthorized"}'
        values: "0+2x30"
      - series: 'dip_intake_api_refused_total{reason="forbidden"}'
        values: "0+5x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: IntakeApiAuthFailures
        exp_alerts: []
      - eval_time: 29m
        alertname: IntakeApiAuthFailures
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "30 intake API uploads with no or a wrong key in 15 minutes"
              description: "Someone is trying keys against the intake API, or a vendor's key was rotated without them."

