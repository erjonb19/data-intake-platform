# Vendor invoices for an accounts-payable department: one Excel invoice register per day,
# one row per invoice (finance pack, Stage 2, S2.5). Generated by
# packs/finance/generators/invoices.py. Native and scanned PDF invoices arrive in Stage 3
# and are matched to these rows by invoice number and total.
feed: finance.vendor_invoice
version: 1
owner: ap-ops@example.com
description: >
  Daily invoice register exported by the AP system as an .xlsx workbook (sheet Invoices,
  a title block above the header). All data is generated and invented.
classification: internal
source:
  channels: [minio, sftp, api]
  filename_pattern: "invoices_*.xlsx"
  filename_date:
    regex: "^invoices_([0-9]+)"
    format: "%Y%m%d"
    max_days_before_received: 7
    max_days_after_received: 0
format: { type: excel, sheet: Invoices, header_row: 3 }
expected_arrival: { cron: "0 18 * * 1-5", grace: 3h }
on_row_violation: quarantine_row
max_bad_row_ratio: 0.1
min_rows: 1
columns:
  - { name: invoice_number, type: string, required: true, unique: true, pattern: "^INV-[0-9]{6}$" }
  - { name: vendor_id, type: string, required: true, pattern: "^V[0-9]{4}$" }
  - { name: vendor_name, type: string, required: true }
  - { name: invoice_date, type: date, required: true, min: "2020-01-01", max: today }
  - { name: due_date, type: date, required: true, min: "2020-01-01" }
  - { name: po_number, type: string, required: true, pattern: "^PO-[0-9]{6}$" }
  - { name: payment_terms, type: string, required: true, allowed: [NET15, NET30, NET45, NET60] }
  - { name: currency, type: string, required: true, allowed: [USD] }
  - { name: subtotal, type: decimal, required: true, min: 0, max: 10000000 }
  - { name: tax, type: decimal, required: true, min: 0, max: 10000000 }
  - { name: total, type: decimal, required: true, min: 0, max: 10000000 }
