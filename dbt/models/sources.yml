version: 2

sources:
  - name: bronze
    description: Written by the intake (dip.intake). One row per accepted FHIR resource.
    tables:
      - name: fhir_resource
  - name: vocab
    description: >
      OMOP vocabulary loaded by `python -m dip vocab-load`: the public OHDSI Eunomia shard
      by default (CI), or a full local Athena download (DIP_ATHENA_DIRS, never committed).
    tables:
      - name: concept
      - name: concept_relationship
      - name: source_to_concept_map
        description: Site-maintained maps for local codes, e.g. MIMIC lab itemid -> LOINC.
  - name: mimic
    description: >
      MIMIC-IV Clinical Database Demo v2.2 tables loaded by dip.relational (M2). REAL,
      de-identified data (ODbL); local only.
    tables:
      - name: patients
      - name: admissions
      - name: diagnoses_icd
      - name: labevents
      - name: prescriptions
      - name: d_labitems
