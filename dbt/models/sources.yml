version: 2

sources:
  - name: bronze
    description: Written by the intake (dip.intake). One row per accepted FHIR resource.
    tables:
      - name: fhir_resource
  - name: vocab
    description: >
      OMOP vocabulary loaded by `python -m dip vocab-load` from the public OHDSI Eunomia
      shard (not a full Athena vocabulary).
    tables:
      - name: concept
      - name: concept_relationship
  - name: mimic
    description: >
      MIMIC-IV Clinical Database Demo v2.2 tables loaded by dip.relational (M2). REAL,
      de-identified data (ODbL); local only.
    tables:
      - name: patients
      - name: admissions
      - name: diagnoses_icd
      - name: labevents
      - name: prescriptions
      - name: d_labitems
