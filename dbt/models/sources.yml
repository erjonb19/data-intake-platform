version: 2

sources:
  - name: bronze
    description: Written by the intake (dip.intake) after the contract checks.
    tables:
      - name: fhir_resource
        description: One row per accepted FHIR resource.
      - name: csv_record
        description: One row per accepted row of a CSV feed (values as a jsonb object).
  - name: ops
    description: Intake bookkeeping, written by dip.intake.
    tables:
      - name: intake_file
        description: One row per processed file (feed, sha256, status, received_at).
      - name: intake_delivery
        description: >
          One row per delivery (content sha256 + file name), with the validated business
          date in the name. Identical content resent under a newer name is a new delivery.
  - name: vocab
    description: >
      OMOP vocabulary loaded by `python -m dip vocab-load`: the public OHDSI Eunomia shard
      by default (CI), or a full local Athena download (DIP_ATHENA_DIRS, never committed).
    tables:
      - name: concept
      - name: concept_relationship
      - name: source_to_concept_map
        description: Site-maintained maps for local codes, e.g. MIMIC lab itemid -> LOINC.
  - name: mimic
    description: >
      MIMIC-IV Clinical Database Demo v2.2 tables loaded by dip.relational (M2). REAL,
      de-identified data (ODbL); local only.
    tables:
      - name: patients
      - name: admissions
      - name: diagnoses_icd
      - name: labevents
      - name: prescriptions
      - name: d_labitems
