version: 2

seeds:
  - name: omop_fixed_concepts
    description: >
      OMOP standard concepts the pipeline uses that a loaded vocabulary may lack (gender,
      race, ethnicity, the EHR type concept, and concept 0): the Eunomia shard lacks some,
      and an Athena download without the Race and Ethnicity vocabularies lacks others.
      Concept IDs are the published OMOP standard IDs. Unioned with vocab.concept by the
      `concept` model; a concept the vocabulary has always wins.
    config:
      column_types:
        concept_id: integer
        valid_start_date: date
        valid_end_date: date
        standard_concept: varchar(1)
        invalid_reason: varchar(1)
  - name: fhir_concept_map
    description: >
      FHIR value sets with no OMOP vocabulary mapping in the shard (administrative gender,
      CDC race/ethnicity OMB categories, encounter class) mapped to OMOP concept IDs.
      Codes not listed map to concept_id 0.
    config:
      column_types:
        concept_id: integer
    columns:
      - name: concept_id
        data_tests:
          - relationships:
              arguments:
                to: ref('concept')
                field: concept_id
