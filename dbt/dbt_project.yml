# dbt project: FHIR bronze -> silver (flattened FHIR) -> gold (OMOP CDM 5.4).
# All data is synthetic (Synthea).
name: dip
version: "0.1.0"
config-version: 2
profile: dip

model-paths: [models]
seed-paths: [seeds]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets: [target]

# Every test result of a run is recorded in ops.dq_results (macros/dq_results.sql).
on-run-end:
  - "{{ store_dq_results(results) }}"
  - "{{ grant_shareable_usage() }}"
  - "{{ grant_cohort_reader() }}"

vars:
  # Which source feeds the staging contract: fhir (Synthea, MIMIC FHIR) or mimic_relational.
  source_kind: fhir
  # De-identification reference date: ages are top-coded relative to it. Fixed (not
  # current_date) so a rebuild of the same inputs gives the same extract (R5).
  deid_reference_date: "2026-01-01"

models:
  dip:
    silver:
      +schema: silver
      +materialized: view
      # FHIR silver reads bronze; off when the source is the MIMIC relational tables.
      +enabled: "{{ var('source_kind', 'fhir') == 'fhir' }}"
    mimic_relational:
      # M2: MIMIC-IV relational tables -> the staging contract. Local only (real data).
      +schema: silver
      +materialized: view
      +enabled: "{{ var('source_kind', 'fhir') == 'mimic_relational' }}"
    staging:
      # The contract between sources (FHIR, MIMIC relational) and OMOP.
      +schema: silver
      +materialized: view
    omop:
      # Gold, restricted tier: pseudonymous OMOP keys, but real (synthetic) dates and
      # source identifiers. The shareable tier (R4) is derived from it.
      +schema: omop
      +materialized: table
    deid:
      # Restricted: the person -> pseudonym and date-shift map. Never granted to anyone.
      +schema: deid
      +materialized: table
    shareable:
      # Shareable tier: de-identified OMOP. The only schema researchers can read.
      +schema: omop_shareable
      +materialized: table
      +grants:
        select: ["dip_researcher"]

seeds:
  dip:
    +schema: vocab
