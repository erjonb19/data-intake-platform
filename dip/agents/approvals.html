<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approvals</title>
<!-- The approvals page (Stage 9, S9.2; dip/agents/gateway.py). No framework, no external
     requests. Everything an agent wrote (payloads, rationales, diffs) is set with
     textContent, never as HTML. -->
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --card: #fff;
          --ok: #1f7a3a; --no: #a3261f; --accent: #2a5db0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #34342f; --card: #1f1f1d;
            --ok: #5cc27a; --no: #f0776f; --accent: #7aa7f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  nav button { background: none; border: 0; padding: 6px 10px; color: var(--muted); cursor: pointer; font: inherit; }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom: 2px solid var(--accent); }
  label { color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--card);
                            border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  main { padding: 16px; max-width: 1200px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover, tbody tr.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .muted { color: var(--muted); }
  .status { font-weight: 600; }
  .status.approved, .status.executed, .allowed { color: var(--ok); }
  .status.rejected, .status.failed, .status.expired, .denied { color: var(--no); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 8px;
        border-radius: 4px; max-height: 420px; overflow: auto; margin: 6px 0; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button.act { border: 0; border-radius: 4px; padding: 6px 14px; color: #fff; cursor: pointer; font: inherit; }
  button.approve { background: var(--ok); } button.reject { background: var(--no); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  #msg { min-height: 1.4em; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Approvals</h1>
  <nav role="tablist">
    <button role="tab" id="tab-proposals" aria-selected="true">Proposals</button>
    <button role="tab" id="tab-audit" aria-selected="false">Audit log</button>
  </nav>
  <span style="flex:1"></span>
  <label>Token <input id="token" type="password" size="14" placeholder="approvals token" autocomplete="off"></label>
  <label>Reviewer <input id="reviewer" size="14" placeholder="your name" autocomplete="off"></label>
</header>
<main>
  <section id="proposals">
    <div class="filters">
      <label>Status
        <select id="status">
          <option>pending</option><option>approved</option><option>rejected</option>
          <option>executed</option><option>failed</option><option>expired</option><option>all</option>
        </select>
      </label>
      <span id="count" class="muted"></span>
    </div>
    <div class="grid">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Agent</th><th>Action</th><th>Group</th><th>Status</th></tr></thead>
        <tbody id="list"></tbody>
      </table></div>
      <div id="detail" class="card muted">Select a proposal.</div>
    </div>
  </section>
  <section id="audit" hidden>
    <div class="filters">
      <input id="f-principal" placeholder="principal">
      <input id="f-tool" placeholder="tool">
      <input id="f-chain" placeholder="chain id">
      <select id="f-decision"><option value="">any decision</option><option>allowed</option><option>denied</option></select>
      <label>since <input id="f-since" type="datetime-local"></label>
      <button id="f-go">Filter</button>
      <button id="f-trace" title="Model and tool calls of the chain id above, in time order">Trace</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>At</th><th>Principal</th><th>Tool</th><th>Tier</th><th>Decision</th><th>Result / reason</th><th>Run</th></tr></thead>
      <tbody id="audit-rows"></tbody>
    </table></div>
    <div id="trace" hidden>
      <h3 id="trace-title">Trace</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>+ms</th><th>ms</th><th>Kind</th><th>Step</th><th>Name</th><th>Status</th><th>Tokens in / out</th><th>Cost $</th></tr></thead>
        <tbody id="trace-rows"></tbody>
      </table></div>
      <div id="trace-steps" class="muted"></div>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = String(text); if (cls) e.className = cls; return e; };
const when = (s) => s ? new Date(s).toLocaleString() : "";
async function api(path, opts) {
  opts = opts || {};
  const token = $("token").value.trim();
  opts.headers = Object.assign({}, opts.headers, token ? { Authorization: "Bearer " + token } : {});
  const r = await fetch(path, opts);
  if (r.status === 401) throw new Error("enter the approvals token (terraform output -raw approvals_token)");
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : r.statusText);
  return body;
}
try { $("reviewer").value = localStorage.getItem("dip.reviewer") || ""; } catch (e) {}
$("reviewer").addEventListener("change", () => { try { localStorage.setItem("dip.reviewer", $("reviewer").value.trim()); } catch (e) {} });
// The token is kept for this tab only (sessionStorage), never across browser sessions.
try { $("token").value = sessionStorage.getItem("dip.token") || ""; } catch (e) {}
$("token").addEventListener("change", () => { try { sessionStorage.setItem("dip.token", $("token").value.trim()); } catch (e) {} loadList(); });

function tab(name) {
  for (const t of ["proposals", "audit"]) {
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
    $(t).hidden = t !== name;
  }
  if (name === "audit") loadAudit(); else loadList();
}
$("tab-proposals").onclick = () => tab("proposals");
$("tab-audit").onclick = () => tab("audit");
$("status").onchange = () => loadList();
$("f-go").onclick = () => loadAudit();
$("f-trace").onclick = () => loadTrace();

let selected = null;
async function loadList() {
  const tbody = $("list");
  try {
    const rows = await api("/api/approvals?status=" + encodeURIComponent($("status").value));
    tbody.replaceChildren();
    $("count").textContent = rows.length + " shown";
    for (const a of rows) {
      const tr = el("tr", null, "row" + (a.approval_id === selected ? " sel" : ""));
      tr.append(el("td", a.approval_id), el("td", a.agent_id), el("td", a.action),
                el("td", (a.group_id || "") + (a.entries ? ` (${a.entries})` : "")),
                el("td", a.status, "status " + a.status));
      tr.onclick = () => show(a.approval_id);
      tbody.append(tr);
    }
    if (!rows.length) { const tr = el("tr"); const td = el("td", "Nothing here.", "muted"); td.colSpan = 5; tr.append(td); tbody.append(tr); }
  } catch (e) { tbody.replaceChildren(el("tr")); $("count").textContent = "error: " + e.message; }
}

async function show(id) {
  selected = id;
  for (const tr of $("list").children) tr.classList.toggle("sel", tr.firstChild && tr.firstChild.textContent === String(id));
  const d = $("detail");
  d.className = "card";
  d.replaceChildren(el("p", "Loading…", "muted"));
  let a;
  try { a = await api("/api/approvals/" + id); } catch (e) { d.replaceChildren(el("p", e.message, "denied")); return; }
  const p = a.payload || {};
  const head = el("h2", `#${a.approval_id} ${a.action}`);
  head.style.margin = "0 0 6px";
  const meta = el("p", null, "muted");
  meta.append(`proposed by ${a.agent_id} at ${when(a.created_at)}, expires ${when(a.expires_at)} · `, el("span", a.status, "status " + a.status));
  d.replaceChildren(head, meta);
  if (a.provider) {  // Stage 10 (S10.1): the model provider each step of the proposing chain ran on
    const fb = a.provider.includes("gemini");
    const r = el("p", null, fb ? "denied" : "muted");
    r.append(el("strong", "Model: "), a.provider + (fb ? " (the free fallback, weaker at judgment: check it closely)" : ""));
    d.append(r);
  }
  const fields = [["Group", p.group_id || p.feed], ["Root cause", p.root_cause], ["Confidence", p.confidence],
                  ["Quarantine entries", (p.quarantine_ids || []).length || null], ["Rationale", p.rationale],
                  ["Message to the vendor", p.message],
                  ["Agent version", p.agent_version && (`${p.agent_version.agent || ""} · ${p.agent_version.model || "?"} · prompt ${(p.agent_version.prompt_sha256 || "").slice(0, 12)}` + (p.agent_version.steps ? " (the map worker's; every step: " + Object.entries(p.agent_version.steps).map(([k, v]) => `${k} ${v.provider || ""} ${v.model || "?"} ${(v.prompt_sha256 || "").slice(0, 12)}`).join("; ") + ")" : ""))], ["Reviewer (advice, not a decision)", p.review && `${p.review.verdict}${(p.review.reasons || []).length ? ": " + p.review.reasons.map(r => r.issue + ": " + r.detail).join("; ") : ""}`], ["Decided by", a.decided_by && `${a.decided_by} at ${when(a.decided_at)}`], ["Reason", a.decision_reason],
                  ["Note", a.decision_note], ["Executed by", a.executed_by && `${a.executed_by} at ${when(a.executed_at)}`]];
  for (const [k, v] of fields) if (v != null && v !== "") { const r = el("p"); r.append(el("strong", k + ": "), String(v)); r.style.margin = "4px 0"; d.append(r); }
  if (a.diff) { d.append(el("strong", "Diff against the current contract")); d.append(el("pre", a.diff)); }
  d.append(el("strong", "Payload")); d.append(el("pre", JSON.stringify(p, null, 2)));
  d.append(el("p", "payload sha256 " + a.payload_sha256, "muted"));
  if (a.result) { d.append(el("strong", "Result")); d.append(el("pre", JSON.stringify(a.result, null, 2))); }
  if (a.status === "pending") {
    const box = el("div", null, "actions");
    const note = el("textarea"); note.rows = 2; note.cols = 40; note.placeholder = "note (optional)";
    const ok = el("button", "Approve", "act approve"), no = el("button", "Reject", "act reject");
    // Stage 11 (S11.5): a rejection says why, from a fixed list.
    const why = el("select"); why.title = "Why reject (required to reject)";
    for (const [v, t] of [["", "reason to reject…"], ["wrong_root_cause", "wrong root cause"], ["wrong_action", "wrong action"],
                          ["incomplete", "incomplete"], ["unsafe", "unsafe"], ["other", "other (say in the note)"]]) {
      const o = el("option", t); o.value = v; why.append(o);
    }
    const msg = el("span", "", "muted"); msg.id = "msg";
    const decide = async (decision) => {
      const who = $("reviewer").value.trim();
      if (!who) { msg.textContent = "Enter your name as reviewer first."; $("reviewer").focus(); return; }
      if (decision === "reject" && !why.value) { msg.textContent = "Choose a reason to reject."; why.focus(); return; }
      ok.disabled = no.disabled = true;
      try {
        const r = await api(`/api/approvals/${id}/decision`, { method: "POST",
          headers: { "Content-Type": "application/json", "X-Reviewer": who },
          body: JSON.stringify({ decision, note: note.value, ...(decision === "reject" ? { reason: why.value } : {}) }) });
        msg.textContent = `${r.status} by ${r.decided_by}`;
        await loadList(); await show(id);
      } catch (e) { msg.textContent = "refused: " + e.message; ok.disabled = no.disabled = false; }
    };
    ok.onclick = () => decide("approve"); no.onclick = () => decide("reject");
    box.append(note, why, ok, no, msg);
    d.append(box);
    d.append(el("p", "Approving does not run anything: a person runs it with `dip approvals execute`, or the proposing agent's Act tier does.", "muted"));
  }
}

async function loadAudit() {
  const q = new URLSearchParams();
  for (const [k, id] of [["principal", "f-principal"], ["tool", "f-tool"], ["decision", "f-decision"], ["chain", "f-chain"]]) if ($(id).value.trim()) q.set(k, $(id).value.trim());
  if ($("f-since").value) q.set("since", new Date($("f-since").value).toISOString());
  const tbody = $("audit-rows");
  try {
    const rows = await api("/api/audit?" + q);
    tbody.replaceChildren();
    for (const r of rows) {
      const tr = el("tr");
      tr.append(el("td", r.audit_id), el("td", when(r.at)), el("td", r.principal), el("td", r.tool), el("td", r.tier),
                el("td", r.decision, r.decision), el("td", [r.result_status, r.reason].filter(Boolean).join(": ")), el("td", r.run_id || "", "muted"));
      tbody.append(tr);
    }
    if (!rows.length) { const tr = el("tr"); const td = el("td", "No audit rows match.", "muted"); td.colSpan = 8; tr.append(td); tbody.append(tr); }
  } catch (e) { tbody.replaceChildren(); const tr = el("tr"); const td = el("td", "error: " + e.message, "denied"); td.colSpan = 8; tr.append(td); tbody.append(tr); }
}

// Stage 11 (S11.2): one chain's model calls (ops.model_call) and tool calls (the audit
// log) in time order, with totals per step. Every value is set as text.
async function loadTrace() {
  const chain = $("f-chain").value.trim(), box = $("trace"), tbody = $("trace-rows");
  box.hidden = false; tbody.replaceChildren(); $("trace-steps").replaceChildren();
  if (!chain) { $("trace-title").textContent = "Trace: enter a chain id first."; return; }
  $("trace-title").textContent = "Trace of " + chain;
  try {
    const t = await api("/api/trace?" + new URLSearchParams({chain}));
    const t0 = t.spans.length ? Date.parse(t.spans[0].started_at) : 0;
    for (const s of t.spans) {
      const tr = el("tr", null, s.kind === "model" ? "model" : "");
      tr.append(el("td", Date.parse(s.started_at) - t0), el("td", s.duration_ms), el("td", s.kind), el("td", s.step || ""),
                el("td", s.name), el("td", s.status, s.status === "denied" ? "denied" : ""),
                el("td", s.kind === "model" ? `${s.input_tokens} / ${s.output_tokens}` : ""), el("td", s.cost_usd == null ? "" : s.cost_usd.toFixed(6)));
      tbody.append(tr);
    }
    if (!t.spans.length) { const tr = el("tr"); const td = el("td", "No spans for this chain.", "muted"); td.colSpan = 8; tr.append(td); tbody.append(tr); }
    for (const s of t.steps) $("trace-steps").append(el("div", `${s.step}: ${s.model_calls} model calls, ${s.tool_calls} tool calls, ${s.input_tokens} in / ${s.output_tokens} out tokens, $${s.cost_usd.toFixed(6)}, ${s.wall_ms} ms`));
  } catch (e) { $("trace-title").textContent = "Trace: error: " + e.message; }
}

const params = new URLSearchParams(location.search);
for (const k of ["principal", "tool", "chain"]) if (params.get(k)) $("f-" + k).value = params.get(k);
if (params.get("tab") === "audit") tab("audit"); else loadList();
if (params.get("tab") === "audit" && params.get("trace") && params.get("chain")) loadTrace();
if (params.get("id")) show(Number(params.get("id")));
</script>
</body>
</html>
