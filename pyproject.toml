[project]
name = "data-intake-platform"
version = "0.1.0"
description = "Free, enterprise-style data intake platform with contracts, quarantine, and governed agents."
requires-python = ">=3.11"
# Kept loose so the package installs into the official Airflow image with --no-deps
# alongside the versions Airflow already ships.
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
  "boto3>=1.34",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "psycopg[binary]==3.3.*",
  "pytest==9.1.*",
  "ruff==0.17.*",
  "dbt-core==1.12.*",
  "dbt-postgres==1.11.*",
  "paramiko==3.5.*",
  # The intake API (images/intake-api pins the same versions).
  "fastapi==0.142.4",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  # Stage 3 PDF invoices (images/ocr pins the same readers; Tesseract itself is only in
  # that image and on CI, so the OCR tests skip without it).
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.14.0",
  "pytesseract==0.3.13",
  "pillow==12.3.0",
  "reportlab==5.0.1",
  # The agent layer (Stage 4): Claude, the MCP server and client, and the HTTP server.
  # Each pin was at least two weeks old when chosen. CI never calls the model.
  "anthropic==1.12.0",
  "mcp==2.3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dip*"]

[tool.setuptools.package-data]
dip = ["*.json", "sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
