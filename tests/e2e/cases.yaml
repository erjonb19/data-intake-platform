# End-to-end cases (PLAN.md section 6), run by tests/e2e/run.py against the live stack.
# Each stage adds rows. Every fixture is hand-written and invented (tests/fixtures/).
#
#   fixture    file under tests/fixtures/, dropped into landing/<feed>/
#   status     expected ops.intake_file status
#   reasons    expected set of ops.quarantine reason codes for the file
#   gold_rows  how many of the file's rows must reach gold (0: the file is quarantined
#              whole, and nothing of it may be in bronze, silver or gold)
#   exclude_rows  data rows (1-based) expected in quarantine, left out of the checksum
#   excel      (per feed) {sheet, header_row} when the feed's fixtures are .xlsx workbooks
#   expect     (PDF cases) the gold row(s) the document must give, written out, since a
#              PDF has no rows to parse here; checked by the same checksum
#   channel    how the fixture is delivered: minio (default, put into landing), sftp
#              (uploaded to the vendor's SFTP account, then the sftp_sync DAG moves it)
#              or api (POSTed to the intake API with the vendor's key);
#              the delivery's recorded channel is checked too
feeds:
  healthcare.eligibility:
    gold_table: gold.member_eligibility
    silver_table: silver.eligibility_record
    # Gold rows are compared with the fixture on every contract column (an md5 over the
    # sorted rows), so a mapping or cast bug in any column fails the case.
    checksum_columns: [member_id, first_name, last_name, dob, sex, plan_code, coverage_start,
                       coverage_end, patient_ref]
    cases:
      - fixture: eligibility/good/elig_good.csv
        status: loaded
        reasons: []
        gold_rows: 6
      - fixture: eligibility/bad/elig_missing_member_id.csv
        status: quarantined
        reasons: ["SCHEMA.MISSING_COLUMN:member_id"]
        gold_rows: 0
      - fixture: eligibility/bad/elig_bad_rows.csv
        status: loaded_with_rejections
        reasons: ["VALUE.NOT_ALLOWED:plan_code"]
        gold_rows: 19
        exclude_rows: [7]   # the row with plan_code GOLD
      - fixture: eligibility/good/elig_sftp.csv
        channel: sftp
        status: loaded
        reasons: []
        gold_rows: 3
      - fixture: eligibility/good/elig_api.csv
        channel: api
        status: loaded
        reasons: []
        gold_rows: 2
  healthcare.claims:
    gold_table: gold.claim_line
    silver_table: silver.claim_record
    checksum_columns: [claim_line_id, claim_id, line_number, member_id, service_date,
                       place_of_service, procedure_code, procedure_system, billed_amount,
                       allowed_amount, paid_amount, coinsurance_amount, deductible_amount,
                       payer]
    cases:
      - fixture: claims/good/claims_good.csv
        status: loaded
        reasons: []
        gold_rows: 5
      - fixture: claims/bad/claims_missing_paid_amount.csv
        status: quarantined
        reasons: ["SCHEMA.MISSING_COLUMN:paid_amount"]
        gold_rows: 0
  finance.vendor_invoice:
    gold_table: gold.vendor_invoice
    silver_table: silver.vendor_invoice_record
    excel: {sheet: Invoices, header_row: 3}
    checksum_columns: [invoice_number, vendor_id, vendor_name, invoice_date, due_date,
                       po_number, payment_terms, currency, subtotal, tax, total]
    cases:
      - fixture: finance/good/invoices_good.xlsx
        status: loaded
        reasons: []
        gold_rows: 12
      - fixture: finance/bad/invoices_breakages.xlsx
        status: loaded_with_rejections
        reasons: ["KEY.DUPLICATE:invoice_number", "VALUE.OUT_OF_RANGE:total",
                  "VALUE.REQUIRED:po_number"]
        gold_rows: 37
        exclude_rows: [2, 3, 4, 41]   # both copies of the duplicate, the credit, no PO
      - fixture: finance/bad/invoices_sheet_renamed.xlsx
        status: quarantined
        reasons: ["SCHEMA.MISSING_SHEET:Invoices"]
        gold_rows: 0
  # Stage 3: invoice PDFs, native and scanned (OCR'd in the OCR task image), matched to the
  # register above in gold.invoice_match. Runs after finance.vendor_invoice (file order).
  finance.vendor_invoice_pdf:
    gold_table: gold.invoice_match
    silver_table: silver.vendor_invoice_pdf_record
    checksum_columns: [invoice_number, vendor_id, po_number, pdf_total, extraction,
                       match_status]
    cases:
      - fixture: finance/good/invoice_native_stacked.pdf
        status: loaded
        reasons: []
        gold_rows: 1
        expect:
          - {invoice_number: INV-483001, vendor_id: V1006, po_number: PO-895547,
             pdf_total: "12940.71", extraction: native, match_status: matched}
      - fixture: finance/good/invoice_native_table.pdf
        status: loaded
        reasons: []
        gold_rows: 1
        expect:
          - {invoice_number: INV-483000, vendor_id: V1001, po_number: PO-794816,
             pdf_total: "1014.32", extraction: native, match_status: matched}
      - fixture: finance/good/invoice_scan.pdf
        status: loaded
        reasons: []
        gold_rows: 1
        expect:
          - {invoice_number: INV-483004, vendor_id: V1006, po_number: PO-504016,
             pdf_total: "14314.85", extraction: ocr, match_status: matched}
      - fixture: finance/good/invoice_total_differs.pdf
        status: loaded
        reasons: []
        gold_rows: 1
        expect:
          - {invoice_number: INV-483002, vendor_id: V1002, po_number: PO-329521,
             pdf_total: "6505.37", extraction: native, match_status: total_differs}
      - fixture: finance/good/invoice_not_in_register.pdf
        channel: api
        status: loaded
        reasons: []
        gold_rows: 1
        expect:
          - {invoice_number: INV-999999, vendor_id: V1001, po_number: PO-552326,
             pdf_total: "24982.29", extraction: native, match_status: not_in_register}
      - fixture: finance/bad/invoice_scan_poor.pdf
        status: quarantined
        reasons: ["OCR.LOW_CONFIDENCE"]
        gold_rows: 0
      - fixture: finance/bad/invoice_not_a_pdf.pdf
        status: quarantined
        reasons: ["PDF.INVALID"]
        gold_rows: 0
